services:
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    ports:
      - "${DATABASE__PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE__NAME:-answer_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    networks:
      - be-answer-hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USER:-postgres} -d ${DATABASE__NAME:-answer_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    container_name: alembic_migrations
    build:
      context: .
      dockerfile: ./build/app/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/app/database/migrations:/app
    volumes:
      - ./app:/app/app
      - ./scripts/run-migrations.sh:/app/scripts/run-migrations.sh:ro
    working_dir: /app/app/database/migrations
    command: ["sh", "/app/scripts/run-migrations.sh"]
    networks:
      - be-answer-hub-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0
    user: "0:0"
    restart: always
    ports:
      - "${S3__PORT:-9000}:9000"
      - "${S3__CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3__ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3__SECRET_KEY:-minioadmin}
    volumes:
      - rustfs_data:/data
    networks:
      - be-answer-hub-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  app:
    container_name: be-answer-hub
    build:
      context: .
      dockerfile: ./build/app/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "${API__PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - be-answer-hub-network
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy

networks:
  be-answer-hub-network:
    driver: bridge

volumes:
  postgres_data:
    name: answer_hub_postgres
  rustfs_data:
    name: answer_hub_rustfs
